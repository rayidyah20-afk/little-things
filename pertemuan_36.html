<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tanggal dan Waktu</title>
  </head>
  <body>
    <form action="">
      <p>Tanggal: <input type="date" name="date" /></p>
      <p>Waktu: <input type="time" name="time" /></p>
      <p>Waktu dan Tanggal: <input type="datetime-local" name="datetime" /></p>
      <p>Bulan dan Tahun: <input type="month" name="month" /></p>
      <p>Minggu ke: <input type="week" name="week" /></p>
    </form>
  </body>
</html>
