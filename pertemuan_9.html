<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pertemuan 9 | List Element</title>
</head>
<body>
   <!-- 1. Ordered List -->
    <ol type="I">
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
        <li>PHP</li>
        <li>MySQL</li>
    </ol> 
    <!-- 2. Unordered List -->
    <ul type="square">
        <li>Google Chrome</li>
        <li>Mozilla Firefox</li>
        <li>Opera Mini</li>
        <li>Microsoft Edge</li>
    </ul> 
    <!-- 3. Description List -->
    <dl>
        <dt>HTML</dt>
        <dd>Hypertext Markup Language, Merupakan bahasa markup untuk membuat halaman web</dd>
        <dt>Lorem </dt>
        <dd>Lorem ipsum dolor sit amet, consectatur adipiscing elit. Quos, Similique. </dd>
    </dl> 
</body>
    
</html>
