<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elemen Tabel</title>
</head>
<body>
    <!-- Rules 
         cols
         rows
         all
         none-->
    <table rules="none" border="1px" cellspacing="1" cellpadding="10" align="center" width="500px">
        <caption>Elemen Tabel pada HTML</caption>
        <tr>
            <th>Ini Kolom 1</th>
            <th>Ini Kolom 2</th>
            <th>Ini Kolom 3</th>
        </tr>
        <tr>
            <td>Isi Baris 1 Kolom 1</td>
            <td>Isi Baris 1 Kolom 2</td>
            <td>Isi Baris 1 Kolom 3</td>
        </tr>
        <tr>
            <td>Isi Baris 2 Kolom 1</td>
            <td>Isi Baris 2 Kolom 2</td>
            <td>Isi Baris 2 Kolom 3</td>
        </tr>
        <tr>
            <td>Isi Baris 3 Kolom 1</td>
            <td>Isi Baris 3 Kolom 2</td>
            <td>Isi Baris 3 Kolom 3</td>
        </tr>

    </table>
</body>
</html>
